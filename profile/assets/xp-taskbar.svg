<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 130" width="1100" height="130" role="img" aria-label="Barra de tarefas do Windows XP com aviso de novos repositórios">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F8CFF"/>
      <stop offset="0.12" stop-color="#245EDB"/>
      <stop offset="1" stop-color="#1941A5"/>
    </linearGradient>
    <linearGradient id="start" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FCF4A"/>
      <stop offset="0.45" stop-color="#3C9B1A"/>
      <stop offset="1" stop-color="#2B7A12"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C9CFF"/>
      <stop offset="0.12" stop-color="#0F5FD9"/>
      <stop offset="1" stop-color="#0B3A9E"/>
    </linearGradient>
    <linearGradient id="task" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D7DEF"/>
      <stop offset="1" stop-color="#2C62D0"/>
    </linearGradient>
    <linearGradient id="taskActive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E52B8"/>
      <stop offset="1" stop-color="#1A46A0"/>
    </linearGradient>
  </defs>

  <!-- Balão de notificação -->
  <g transform="translate(700,6)">
    <path d="M0 0 H380 A8 8 0 0 1 388 8 V56 A8 8 0 0 1 380 64 H330 L318 76 L314 64 H8 A8 8 0 0 1 0 56 V8 A8 8 0 0 1 8 0 Z" fill="#FFFFE1" stroke="#000" stroke-width="1"/>
    <circle cx="22" cy="20" r="9" fill="#2B6BD6"/>
    <rect x="21" y="17" width="2.4" height="8" fill="#fff"/>
    <rect x="21" y="13" width="2.4" height="2.4" fill="#fff"/>
    <g font-family="Tahoma, Verdana, sans-serif" fill="#000">
      <text x="38" y="24" font-size="12" font-weight="700">Novos repositórios disponíveis</text>
      <text x="38" y="42" font-size="11">Clique aqui para abrir a lista de repositórios da 1TDSPB</text>
      <text x="38" y="56" font-size="11">e ficar por dentro das aulas e entregas.</text>
    </g>
    <path d="M368 12 L376 20 M376 12 L368 20" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Barra -->
  <g transform="translate(0,82)">
    <rect width="1100" height="48" fill="url(#bar)"/>
    <rect x="0" y="0" width="1100" height="1" fill="#7BB1FF"/>
    <rect x="0" y="0" width="118" height="48" rx="16" fill="url(#start)"/>
    <rect x="0" y="0" width="118" height="1.5" fill="#B6F08F" opacity="0.7"/>
    <g transform="translate(10,13) scale(0.92)">
      <path fill="#F35325" d="M9.302 1.415c-1.184.02-2.592.32-4.341 1.044l-2.283 7.949c1.846-.761 3.311-1.114 4.537-1.1a7.596 7.596 0 0 1 4.37 1.593l2.296-7.92c-1.26-.855-2.607-1.599-4.58-1.566z"/>
      <path fill="#81BC06" d="M15.052 3.826l-2.256 7.949c2.016 1.367 4.44 2.494 8.907.493L24 4.333h-.042c-4.651 1.931-6.906.846-8.907-.507z"/>
      <path fill="#05A6F0" d="M6.617 10.77c-1.184.018-2.591.315-4.335 1.034L0 19.779c4.65-1.93 6.863-.803 8.878.55l2.326-7.99c-1.26-.855-2.613-1.6-4.586-1.57z"/>
      <path fill="#FFBA08" d="M12.412 13.122l-2.294 7.898c2.015 1.367 4.256 2.453 8.906.522l2.297-7.92c-4.641 1.927-6.882.85-8.909-.5Z"/>
    </g>
    <text x="40" y="30" font-family="Tahoma, 'Trebuchet MS', Verdana, sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#fff">Iniciar</text>

    <g font-family="Tahoma, Verdana, sans-serif" font-size="12" fill="#fff">
      <rect x="128" y="8" width="160" height="32" rx="2" fill="url(#taskActive)" stroke="#12377F"/>
      <text x="140" y="29">1TDSPB — Início</text>
      <rect x="296" y="8" width="160" height="32" rx="2" fill="url(#task)" stroke="#1A4FB8"/>
      <text x="308" y="29">cmd.exe</text>
      <rect x="464" y="8" width="170" height="32" rx="2" fill="url(#task)" stroke="#1A4FB8"/>
      <text x="476" y="29">conecta-campus</text>
    </g>

    <rect x="960" y="0" width="140" height="48" fill="url(#tray)"/>
    <rect x="960" y="0" width="1" height="48" fill="#0A2E80"/>
    <rect x="961" y="0" width="1" height="48" fill="#2E77E8"/>
    <g transform="translate(972,15)">
      <rect width="18" height="18" rx="3" fill="#ED145B"/>
      <text x="9" y="13" text-anchor="middle" font-family="Tahoma, Verdana, sans-serif" font-size="8" font-weight="700" fill="#fff">FIAP</text>
    </g>
    <g transform="translate(996,15)">
      <rect width="18" height="18" rx="9" fill="#24292F"/>
      <text x="9" y="13" text-anchor="middle" font-family="Tahoma, Verdana, sans-serif" font-size="8" font-weight="700" fill="#fff">git</text>
    </g>
    <text x="1060" y="29" text-anchor="middle" font-family="Tahoma, Verdana, sans-serif" font-size="12" fill="#fff">
      14:33
      <animate attributeName="opacity" values="1;1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
